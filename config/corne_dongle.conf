# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Halves read each other's battery level from the dongle, so it must fetch them
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Lets the dongle relay Caps, Num and Scroll Lock to the halves' displays
CONFIG_ZMK_HID_INDICATORS=y
